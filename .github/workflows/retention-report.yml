name: Retention inventory (read only)
on:
  schedule:
    - cron: '17 7 * * 0'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  packages: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Report only; no permission to delete
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_OWNER_TYPE: user
        run: |
          python3 scripts/retention.py --report retention.json
          cat retention.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: fiscal-retention-report-${{ github.run_id }}
          path: retention.json
          retention-days: 30
