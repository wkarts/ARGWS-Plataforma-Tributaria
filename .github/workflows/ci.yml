name: CI
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  infrastructure:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Validate version, deploy matrix and Compose semantics
        run: |
          python3 scripts/version.py check
          python3 scripts/validate_deploys.py --docker
          python3 -m compileall -q scripts tools/deployer
          python3 -m unittest discover -s scripts -p 'test_*.py' -v
          python3 -m unittest discover -s tools/deployer -p 'test_*.py' -v
          bash -n scripts/*.sh
      - name: Validate image names, base manifest and protected cleanup policy
        run: python3 scripts/validate_release.py
      - name: Start actual Redis container and verify health with Docker Compose
        shell: bash
        run: |
          set -euo pipefail
          export COMPOSE_PROJECT_NAME="fiscalredistest-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          export IMAGE_OWNER="wkarts"
          export APP_TAG="v$(cat VERSION)"
          export SECRET_KEY="ci-only-not-a-real-secret-123456789012345"
          export BOOTSTRAP_ADMIN_EMAIL="admin@example.invalid"
          export BOOTSTRAP_ADMIN_PASSWORD="ci-only-not-a-real-password-123456789"
          export POSTGRES_PASSWORD="ci-only-not-a-real-postgres-password"
          export REDIS_PASSWORD="ci-only-not-a-real-redis-password"
          export RABBITMQ_DEFAULT_PASS="ci-only-not-a-real-rabbit-password"
          export S3_ACCESS_KEY="ci-only-s3-access"
          export S3_SECRET_KEY="ci-only-s3-secret-123456789012"
          compose=(docker compose -p "$COMPOSE_PROJECT_NAME" -f deploy/docker/production/compose.yaml)
          trap '"${compose[@]}" down --volumes --remove-orphans >/dev/null 2>&1 || true' EXIT
          "${compose[@]}" up -d --no-deps --wait redis
          id="$("${compose[@]}" ps -q redis)"
          test -n "$id"
          docker inspect --format '{{json .Config.Cmd}}' "$id" | python3 -c '
          import json,sys
          command=json.load(sys.stdin)
          assert isinstance(command,list) and len(command)==1, "Redis shell script must be one argv entry"
          assert "exec redis-server" in command[0], "Redis executable was not invoked"
          '
          docker exec "$id" sh -ec 'REDISCLI_AUTH="$REDIS_PASSWORD" redis-cli ping' | grep -Fx 'PONG'
      - name: Check that PR changes merge cleanly with main before publish
        if: github.event_name == 'pull_request' && github.base_ref == 'develop'
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if ! git merge-tree --write-tree origin/main HEAD >/dev/null; then
            echo "::error::A PR conflita com main. Reconcile os históricos antes de integrar na develop."
            exit 1
          fi
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: fiscal_ci
          POSTGRES_USER: fiscal_ci
          POSTGRES_PASSWORD: fiscal_ci_ephemeral
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U fiscal_ci -d fiscal_ci"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_DB: fiscal_ci
      POSTGRES_USER: fiscal_ci
      POSTGRES_PASSWORD: fiscal_ci_ephemeral
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Install backend and test dependencies
        working-directory: apps/api
        run: python -m pip install -e '.[test]'
      - name: Test API, worker, scheduler and contracts
        working-directory: apps/api
        run: python -m pytest -q
      - name: Apply and compare migrations on PostgreSQL
        working-directory: apps/api
        run: |
          alembic upgrade head
          alembic check
      - name: Smoke central bootstrap with PostgreSQL and real RustFS S3
        working-directory: apps/api
        timeout-minutes: 5
        env:
          APP_ENV: production
          DEPLOYMENT_MODE: central
          PROVIDER_MODE: disabled
          BOOTSTRAP_ADMIN_EMAIL: admin@example.invalid
          BOOTSTRAP_ADMIN_PASSWORD: CIbootstrap-password-only-2026
          SECRET_KEY: CI-test-only-application-signing-key-2026-0001
          S3_ENDPOINT: 127.0.0.1:19000
          S3_ACCESS_KEY: CIACCESS2026
          S3_SECRET_KEY: CItemporary-rustfs-secret-key-2026
          S3_BUCKET: fiscal-evidence
          S3_REGION: us-east-1
          S3_USE_SSL: 'false'
        shell: bash
        run: |
          set -euo pipefail
          container="fiscal-bootstrap-rustfs-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          trap 'docker rm -f "$container" >/dev/null 2>&1 || true' EXIT
          docker run -d --name "$container" -p 127.0.0.1:19000:9000 \
            -e RUSTFS_ACCESS_KEY="$S3_ACCESS_KEY" \
            -e RUSTFS_SECRET_KEY="$S3_SECRET_KEY" \
            -e RUSTFS_ADDRESS=:9000 \
            -e RUSTFS_CONSOLE_ENABLE=false \
            rustfs/rustfs:1.0.1 /data >/dev/null
          ready=false
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:19000/health/ready >/dev/null; then
              ready=true
              break
            fi
            sleep 2
          done
          if [[ "$ready" != true ]]; then
            echo "::error::RustFS S3 não passou na verificação de readiness"
            docker logs "$container" --tail 40 || true
            exit 1
          fi
          # Simulates the exact legacy bootstrap used by Docker/Dockge production.
          python -m app.bootstrap
          # A repeated deployment must never create a second administrator.
          python -m app.bootstrap
          python - <<'PY'
          import boto3
          import os
          import psycopg
          from botocore.config import Config

          store = boto3.client(
              "s3", endpoint_url="http://" + os.environ["S3_ENDPOINT"],
              aws_access_key_id=os.environ["S3_ACCESS_KEY"],
              aws_secret_access_key=os.environ["S3_SECRET_KEY"],
              region_name=os.environ["S3_REGION"],
              config=Config(s3={"addressing_style": "path"}),
          )
          store.head_bucket(Bucket=os.environ["S3_BUCKET"])
          with psycopg.connect(
              host=os.environ["POSTGRES_HOST"], dbname=os.environ["POSTGRES_DB"],
              user=os.environ["POSTGRES_USER"], password=os.environ["POSTGRES_PASSWORD"]
          ) as db:
              with db.cursor() as cursor:
                  cursor.execute("SELECT count(*) FROM users WHERE username = %s",
                                 (os.environ["BOOTSTRAP_ADMIN_EMAIL"],))
                  assert cursor.fetchone()[0] == 1, "Administrador duplicado/ausente"
          print("OK: bootstrap idempotente PostgreSQL + RustFS e bucket S3 válido")
          PY
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install, test and build web application
        working-directory: apps/web
        run: |
          npm ci --no-audit --no-fund
          npm test
          npm run build
      - name: Audit customer-facing web and self-hosted deployment
        run: python3 scripts/audit_customer_surface.py --web-dist apps/web/dist --self-dir deploy/self
  containers:
    needs: [infrastructure, backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: docker/setup-buildx-action@v3
      - name: Build local API and web images without GHCR
        run: |
          docker buildx build --platform linux/amd64 -f infra/docker/api.Dockerfile \
            --build-arg PYTHON_BASE=python:3.13-slim-bookworm --build-arg APP_VERSION="$(cat VERSION)" .
          docker buildx build --platform linux/amd64 -f infra/docker/web.Dockerfile \
            --build-arg NODE_BASE=node:22-alpine --build-arg NGINX_BASE=nginx:1.30-alpine \
            --build-arg APP_VERSION="$(cat VERSION)" .
  self_hosted:
    needs: [infrastructure, backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Build and boot the local SQLite installation
        run: |
          set -euo pipefail
          printf '%s\n%s\n' 'ci-test-only-strong-password-2026' 'ci-test-only-strong-password-2026' | \
            python3 deploy/self/init_secrets.py --project fiscal-ci --email admin@example.invalid
          docker compose --env-file deploy/self/.env -f deploy/self/compose.yaml config -q
          docker compose --env-file deploy/self/.env -f deploy/self/compose.yaml up -d --build --wait
          curl --fail --silent --show-error http://127.0.0.1:48080/healthz
          curl --fail --silent --show-error http://127.0.0.1:48080/api/v1/installation/branding \
            | python3 -c 'import json,sys; assert json.load(sys.stdin)["version"] == 0'
          curl --fail --silent --show-error -H 'Content-Type: application/json' \
            --data '{"username":"admin@example.invalid","password":"ci-test-only-strong-password-2026"}' \
            http://127.0.0.1:48080/api/v1/auth/login \
            | python3 -c 'import json,sys; assert json.load(sys.stdin)["access_token"]'
          python3 deploy/self/init_secrets.py --erase-bootstrap-password
          docker compose --env-file deploy/self/.env -f deploy/self/compose.yaml up -d --wait
          curl --fail --silent --show-error http://127.0.0.1:48080/healthz
      - name: Show service logs on failure
        if: failure()
        run: docker compose --env-file deploy/self/.env -f deploy/self/compose.yaml logs --no-color --tail=100
