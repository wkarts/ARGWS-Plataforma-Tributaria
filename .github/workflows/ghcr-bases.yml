name: GHCR base images
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: fiscal-base-images
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.manifest.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - id: manifest
        name: Validate declarative base manifest
        run: |
          python3 scripts/validate_release.py
          python3 - <<'PY'
          import json, os
          data=json.load(open('.github/base-images.json',encoding='utf-8'))
          assert data['owner'].lower()==os.environ['GITHUB_REPOSITORY_OWNER'].lower()
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as out:
              out.write('matrix='+json.dumps({'include':data['bases']},separators=(',',':'))+'\n')
          PY
  publish:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: exists
        name: Protect the canonical base tag
        env:
          PACKAGE: ${{ matrix.package }}
          TAG: ${{ matrix.tag }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/$PACKAGE:$TAG"
          if docker buildx imagetools inspect "$image" >/dev/null 2>base-inspect-error.txt; then
            echo 'build=false' >> "$GITHUB_OUTPUT"
          elif grep -Eiq '(not found|manifest unknown|NAME_UNKNOWN|404)' base-inspect-error.txt; then
            echo 'build=true' >> "$GITHUB_OUTPUT"
          else
            echo 'Base registry check failed; refusing a possible overwrite.' >&2
            sed -n '1,12p' base-inspect-error.txt >&2
            exit 1
          fi
      - uses: docker/build-push-action@v6
        if: steps.exists.outputs.build == 'true'
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platforms }}
          push: true
          provenance: mode=max
          sbom: true
          tags: ghcr.io/${{ github.repository_owner }}/${{ matrix.package }}:${{ matrix.tag }}
          cache-from: type=gha,scope=base-${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=base-${{ matrix.component }}
      - name: Verify the base digest
        env:
          PACKAGE: ${{ matrix.package }}
          TAG: ${{ matrix.tag }}
        run: docker buildx imagetools inspect "ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/$PACKAGE:$TAG"
