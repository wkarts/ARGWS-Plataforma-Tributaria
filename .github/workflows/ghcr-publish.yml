name: GHCR publish and release
on:
  push:
    branches: [develop, main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fiscal-publish-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false
jobs:
  verify:
    uses: ./.github/workflows/ci.yml
    permissions: {contents: read}
  source:
    needs: verify
    runs-on: ubuntu-latest
    permissions: {contents: read}
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      channel: ${{ steps.metadata.outputs.channel }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - id: metadata
        name: Enforce stable VERSION and canonical Git tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 scripts/version.py check
          version="$(python3 scripts/version.py current)"
          channel="$GITHUB_REF_NAME"
          [[ "$channel" == develop || "$channel" == main ]] || { echo 'Only develop/main can publish'; exit 1; }
          if [[ "$channel" == main ]]; then
            if tag_json="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$version" 2>/dev/null)"; then
              existing="$(jq -r 'if type == "object" then (.object.sha // empty) else empty end' <<< "$tag_json")"
              if [[ -n "$existing" ]]; then
                if [[ "$(jq -r '.object.type // empty' <<< "$tag_json")" == tag ]]; then
                  existing="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$existing" --jq '.object.sha')"
                fi
                [[ "$existing" == "$GITHUB_SHA" ]] || { echo 'Published SemVer tag belongs to another commit'; exit 1; }
              fi
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
  stage:
    needs: source
    runs-on: ubuntu-latest
    permissions: {contents: write}
    outputs:
      tag: ${{ steps.metadata.outputs.tag }}
    steps:
      - id: metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="internal-build-$GITHUB_SHA"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          ref="repos/$GITHUB_REPOSITORY/git/ref/tags/$tag"
          if ref_json="$(gh api "$ref" 2>ref-error.txt)"; then
            existing="$(jq -r '.object.sha // empty' <<< "$ref_json")"
          elif grep -Eq '(404|Not Found)' ref-error.txt || \
               [[ "$(jq -r '.status // empty' <<< "$ref_json")" == 404 ]]; then
            existing=''
          else
            cat ref-error.txt >&2; exit 1
          fi
          if [[ -z "$existing" ]]; then
            gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/tags/$tag" -f sha="$GITHUB_SHA" >/dev/null
          elif [[ "$existing" != "$GITHUB_SHA" ]]; then
            echo "Internal staging tag points to $existing, expected $GITHUB_SHA" >&2; exit 1
          fi
          if release_json="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" 2>release-error.txt)"; then
            draft="$(jq -r 'if has("draft") then .draft else empty end' <<< "$release_json")"
          elif grep -Eq '(404|Not Found)' release-error.txt || \
               [[ "$(jq -r '.status // empty' <<< "$release_json")" == 404 ]]; then
            draft=''
          else
            cat release-error.txt >&2; exit 1
          fi
          if [[ -z "$draft" ]]; then
            gh release create "$tag" --draft --verify-tag \
              --title "Internal build assets ${GITHUB_SHA::12}" \
              --notes "Temporary verified binaries for commit $GITHUB_SHA." \
              --repo "$GITHUB_REPOSITORY"
          elif [[ "$draft" != true ]]; then
            echo 'Internal staging release must remain a draft' >&2; exit 1
          fi
  bases:
    needs: source
    uses: ./.github/workflows/ghcr-bases.yml
    permissions: {contents: read, packages: write}
  deployer:
    needs: stage
    uses: ./.github/workflows/deployer-windows.yml
    with:
      staging_tag: ${{ needs.stage.outputs.tag }}
    permissions: {contents: write}
  collector:
    needs: stage
    uses: ./.github/workflows/collector-binaries.yml
    with:
      staging_tag: ${{ needs.stage.outputs.tag }}
    permissions: {contents: write}
  images:
    needs: [source, bases]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions: {contents: read, packages: write, attestations: write, id-token: write}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {part: api, dockerfile: infra/docker/api.Dockerfile}
          - {part: web, dockerfile: infra/docker/web.Dockerfile}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: sha
        env:
          PART: ${{ matrix.part }}
        run: |
          echo "tag=sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/reforma-tributaria-$PART" >> "$GITHUB_OUTPUT"
      - id: existing
        name: Preserve an existing SHA image on retries
        env:
          PART: ${{ matrix.part }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/reforma-tributaria-$PART:sha-${GITHUB_SHA::12}"
          if docker buildx imagetools inspect "$image" >/dev/null 2>inspect-error.txt; then
            echo 'build=false' >> "$GITHUB_OUTPUT"
          elif grep -Eiq '(not found|manifest unknown|NAME_UNKNOWN|404)' inspect-error.txt; then
            echo 'build=true' >> "$GITHUB_OUTPUT"
          else
            echo 'Registry check failed; refusing to overwrite SHA tag.' >&2; exit 1
          fi
      - id: publish
        uses: docker/build-push-action@v6
        if: steps.existing.outputs.build == 'true'
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.sha.outputs.image }}:${{ steps.sha.outputs.tag }}
          build-args: |
            APP_VERSION=${{ needs.source.outputs.version }}
            BUILD_SHA=${{ github.sha }}
          cache-from: type=gha,scope=fiscal-${{ matrix.part }}
          cache-to: type=gha,mode=max,scope=fiscal-${{ matrix.part }}
      - uses: actions/attest-build-provenance@v2
        if: steps.existing.outputs.build == 'true'
        with:
          subject-name: ${{ steps.sha.outputs.image }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true
  release:
    needs: [source, stage, images, deployer, collector]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions: {contents: write, packages: write}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: 'npm', cache-dependency-path: apps/web/package-lock.json}
      - name: Download binary assets from the internal draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STAGING_TAG: ${{ needs.stage.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p release-collector-linux release-collector-windows release-deployer
          for file in fiscal-xml-collector-gui-linux-x64.tar.gz SHA256SUMS-collector-linux.txt; do
            gh release download "$STAGING_TAG" --pattern "$file" --dir release-collector-linux --repo "$GITHUB_REPOSITORY"
          done
          for file in fiscal-xml-collector-setup-windows-x64.exe SHA256SUMS-collector-windows.txt; do
            gh release download "$STAGING_TAG" --pattern "$file" --dir release-collector-windows --repo "$GITHUB_REPOSITORY"
          done
          mv release-collector-linux/SHA256SUMS-collector-linux.txt release-collector-linux/SHA256SUMS.txt
          mv release-collector-windows/SHA256SUMS-collector-windows.txt release-collector-windows/SHA256SUMS.txt
          for file in Fiscal-Deployer-GUI-Windows-x64.zip README-Deployer.md SHA256SUMS-deployer.txt; do
            gh release download "$STAGING_TAG" --pattern "$file" --dir release-deployer --repo "$GITHUB_REPOSITORY"
          done
          mv release-deployer/SHA256SUMS-deployer.txt release-deployer/SHA256SUMS.txt
          (cd release-deployer && sha256sum -c SHA256SUMS.txt)
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          archive = Path("release-deployer/Fiscal-Deployer-GUI-Windows-x64.zip")
          with ZipFile(archive) as package:
              required = {"fiscal-deployer-gui-win-x64.exe",
                          "fiscal-deployer-worker-win-x64.exe", "SHA256SUMS.txt", "README-Deployer.md"}
              missing = required - set(package.namelist())
              if missing:
                  raise SystemExit(f"Deployer Windows sem componentes: {sorted(missing)}")
          PY
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify all images and record immutable digests
        env:
          VERSION: ${{ needs.source.outputs.version }}
          CHANNEL: ${{ needs.source.outputs.channel }}
        run: |
          set -euo pipefail
          mkdir -p release-files
          : > release-files/IMAGES.txt
          : > release-files/BASE-IMAGES.txt
          inspect_digest() {
            local reference="$1" attempt output digest
            for attempt in {1..15}; do
              if output="$(docker buildx imagetools inspect "$reference" 2>&1)"; then
                digest="$(awk '$1=="Digest:"{print $2;exit}' <<< "$output")"
                if [[ "$digest" == sha256:* ]]; then printf '%s' "$digest"; return 0; fi
              fi
              sleep 4
            done
            echo "Missing GHCR image $reference: $output" >&2; return 1
          }
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          for part in api web; do
            image="ghcr.io/$owner/reforma-tributaria-$part"
            digest="$(inspect_digest "$image:sha-${GITHUB_SHA::12}")"
            echo "$image@$digest" >> release-files/IMAGES.txt
          done
          python3 - <<'PY' > /tmp/fiscal-base-refs.txt
          import json,os
          owner=os.environ['GITHUB_REPOSITORY_OWNER'].lower()
          for item in json.load(open('.github/base-images.json'))['bases']:
              print(f"ghcr.io/{owner}/{item['package']}:{item['tag']}")
          PY
          while IFS= read -r reference; do
            echo "$reference@$(inspect_digest "$reference")" >> release-files/BASE-IMAGES.txt
          done < /tmp/fiscal-base-refs.txt
          api_ref="$(head -n1 release-files/IMAGES.txt)"
          docker run --rm --platform linux/amd64 --entrypoint python "$api_ref" -m pip freeze > release-files/API-DEPENDENCIES.txt
      - name: Verify collector binaries and package release assets with SHA-256
        env:
          CHANNEL: ${{ needs.source.outputs.channel }}
          VERSION: ${{ needs.source.outputs.version }}
        run: |
          set -euo pipefail
          python3 scripts/verify_collector_assets.py release-collector-linux release-collector-windows
          cp release-collector-linux/fiscal-xml-collector-gui-linux-x64.tar.gz release-files/
          cp release-collector-windows/fiscal-xml-collector-setup-windows-x64.exe release-files/
          cp release-deployer/Fiscal-Deployer-GUI-Windows-x64.zip release-files/
          cp tools/collector/systemd/README-self.md release-files/README-XML-Collector-Linux.md
          cp tools/collector/windows/README-installer.md release-files/README-XML-Collector-Windows.md
          cp docs/CONTRATOS-OFICIAIS-2026.md release-files/CONTRATOS-OFICIAIS-2026.md
          if find deploy apps -type f -name '.env*' ! -name '.env.example' -print -quit | grep -q .; then
            echo 'Private dotenv in source; refusing release' >&2; exit 1
          fi
          label="$VERSION"
          [[ "$CHANNEL" == develop ]] && label=preview
          zip -q -r "release-files/Fiscal-Self-Deploy-$label.zip" deploy/self apps/api apps/web infra/docker/nginx.conf scripts/sync_deploy_env.py VERSION \
            -x '*/.env' '*/secrets/*' '*/backups/*' '*/volumes/*' \
               '*/node_modules/*' '*/dist/*' '*/.venv/*' '*/__pycache__/*' \
               '*/*.egg-info/*' '*.pyc' '*.sqlite3' '*.db' '*.pem' '*.p12' '*.pfx' '*.log'
          python3 scripts/build_deploy_matrix.py --output "release-files/Fiscal-Deploy-Matrix-$label.zip"
          python3 - <<'PY'
          import zipfile
          from pathlib import Path
          package = next(Path('release-files').glob('Fiscal-Self-Deploy-*.zip'))
          with zipfile.ZipFile(package) as archive:
              names = set(archive.namelist())
              required = {'deploy/self/compose.yaml', 'deploy/self/api.Dockerfile',
                          'deploy/self/web.Dockerfile', 'apps/api/pyproject.toml',
                          'apps/web/package.json', 'infra/docker/nginx.conf',
                          'scripts/sync_deploy_env.py', 'VERSION'}
              missing = required - names
              forbidden = [name for name in names if name.startswith('deploy/') and not name.startswith('deploy/self/')]
              if missing or forbidden:
                  raise SystemExit(f'Invalid self deployment archive: missing={missing}, forbidden={forbidden}')
          matrix = next(Path('release-files').glob('Fiscal-Deploy-Matrix-*.zip'))
          with zipfile.ZipFile(matrix) as bundle:
              entries = set(bundle.namelist())
              required = {'deploy/compose.yaml', 'deploy/env.develop.example',
                          'deploy/env.production.example', 'deploy/README.md',
                          'scripts/deploy.sh', 'scripts/preflight.py',
                          'scripts/sync_deploy_env.py', 'tools/deployer/deployer.py',
                          'tools/deployer/release_catalog.py', 'tools/deployer/integrations.py', 'VERSION'}
              for target in ('', 'docker/', 'dockge/', 'portainer/', 'cloudpanel/'):
                  for channel in ('develop', 'production'):
                      root = f'deploy/{target}{channel}/'
                      required.add(root + 'compose.yaml')
                      required.add(root + '.env.example')
              missing = required - entries
              unsafe = [name for name in entries if name.endswith('/.env')
                        or '/secrets/' in name or '/backups/' in name or '/volumes/' in name]
              if missing or unsafe:
                  raise SystemExit(f'Invalid deploy matrix: missing={sorted(missing)}, unsafe={unsafe}')
              for name in required:
                  if bundle.read(name) != Path(name).read_bytes():
                      raise SystemExit(f'Deploy matrix diverges from Git HEAD: {name}')
          PY
          npm ci --prefix apps/web --no-audit --no-fund
          npm run build --prefix apps/web
          python3 scripts/audit_customer_surface.py --web-dist apps/web/dist \
            --self-dir deploy/self --release-dir release-files
          {
            echo "Version=$VERSION"
            echo "Commit=$GITHUB_SHA"
            echo 'Use IMAGES.txt and BASE-IMAGES.txt for immutable registry digests.'
          } > release-files/BUILD-INFO.txt
          (cd release-files && sha256sum -- * > SHA256SUMS.txt)
      - name: Confirm stable release still points to the verified commit
        if: needs.source.outputs.channel == 'main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHANNEL: ${{ needs.source.outputs.channel }}
        run: |
          set -euo pipefail
          head="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$CHANNEL" --jq '.object.sha')"
          [[ "$head" == "$GITHUB_SHA" ]] || {
            echo "$CHANNEL advanced to $head; skipping publication of stale $GITHUB_SHA" >&2
            exit 1
          }
      - name: Promote verified tags and publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.source.outputs.version }}
          CHANNEL: ${{ needs.source.outputs.channel }}
        run: |
          bash scripts/publish_release.sh release-files
      - name: Remove the temporary draft and its tag after successful publication
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STAGING_TAG: ${{ needs.stage.outputs.tag }}
        run: |
          set -euo pipefail
          gh release delete "$STAGING_TAG" --yes --cleanup-tag --repo "$GITHUB_REPOSITORY"
