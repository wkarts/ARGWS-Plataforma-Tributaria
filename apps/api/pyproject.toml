[project]
name = "fiscal-assist-api"
version = "0.3.4"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "sqlalchemy[asyncio]>=2.0,<2.1",
  "aiosqlite>=0.20,<1",
  "asyncpg>=0.29,<1",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.13,<2",
  "pydantic-settings>=2.5,<3",
  "PyJWT>=2.9,<3",
  "argon2-cffi>=23.1,<26",
  "httpx>=0.27,<1",
  "boto3>=1.35,<2",
  "celery>=5.4,<6",
  "redis>=5,<7",
  "pillow>=11,<13",
  "python-multipart>=0.0.20,<1",
  "cryptography>=43,<47",
]

[project.optional-dependencies]
test = ["pytest>=8,<9", "pytest-asyncio>=0.24,<2", "fakeredis>=2.25,<3"]

[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["alembic*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
